<!doctype html><html><head><meta charset="utf-8"><style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--figma-color-text);background:var(--figma-color-bg);font-size:12px}*{box-sizing:border-box}body{margin:0;padding:18px}h1{font:600 17px/1.2 ui-sans-serif,system-ui;margin:0 0 18px}.label{color:var(--figma-color-text-secondary);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.row{display:flex;justify-content:space-between;gap:12px;margin:0 0 15px}.value{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#888}.dot.on{background:#16a36a}input[type=url]{width:100%;background:var(--figma-color-bg-secondary);color:inherit;border:1px solid var(--figma-color-border);border-radius:5px;padding:8px;margin-bottom:10px}button{width:100%;border:0;border-radius:6px;padding:10px 12px;margin:0 0 8px;font:600 12px ui-sans-serif,system-ui;cursor:pointer;background:var(--figma-color-bg-brand);color:var(--figma-color-text-onbrand)}button.secondary{background:var(--figma-color-bg-secondary);color:var(--figma-color-text);border:1px solid var(--figma-color-border)}button:disabled{opacity:.45}.options{display:flex;gap:14px;margin:11px 0 16px;color:var(--figma-color-text-secondary)}progress{width:100%;height:5px;accent-color:var(--figma-color-bg-brand);margin:5px 0 8px}.panel{border-top:1px solid var(--figma-color-border);margin-top:13px;padding-top:13px;line-height:1.65}.ok{color:#16a36a}.error{color:var(--figma-color-text-danger)}small{color:var(--figma-color-text-secondary)}</style></head>
<body><h1>Figma Mirror</h1><div class="label">API</div><input id="endpoint" type="url" value="http://localhost:3000"><div class="row"><span class="status"><i class="dot" id="dot"></i><span id="connection">Checking…</span></span></div><div class="label">File</div><div class="row value" id="file">—</div><div class="label">Selection</div><div class="row value" id="selection">—</div><div class="options"><label><input id="hidden" type="checkbox"> Hidden</label><label>Scale <select id="scale"><option>1</option><option selected>2</option></select>×</label></div><button id="selectionButton">Export Selection</button><button class="secondary" id="pageButton">Export Current Page</button><div id="work" hidden><progress id="progress" max="100"></progress><small id="progressText"></small></div><div class="panel" id="result"><span class="label">Last snapshot</span><br><small>No exports yet</small></div>
<script>const $=id=>document.getElementById(id),endpoint=$('endpoint');endpoint.value=localStorage.getItem('endpoint')||endpoint.value;function send(message){parent.postMessage({pluginMessage:{...message,endpoint:endpoint.value.replace(/\/$/,'')}},'*')}function busy(value){$('selectionButton').disabled=value;$('pageButton').disabled=value;$('work').hidden=!value}function ping(){localStorage.setItem('endpoint',endpoint.value);send({type:'ping'})}onmessage=({data:{pluginMessage:m}={}})=>{if(!m)return;if(m.type==='context'){$('file').textContent=m.file;$('selection').textContent=m.selection}if(m.type==='connection'){$('connection').textContent=m.connected?'Connected':'Unavailable';$('dot').className='dot '+(m.connected?'on':'')}if(m.type==='progress'){busy(true);$('progress').value=m.value;$('progressText').textContent=m.message}if(m.type==='result'){busy(false);$('result').innerHTML=`<span class="label">Last snapshot</span><br><span class="ok">✓ ${m.result.nodeCount} nodes<br>✓ ${m.result.assets} assets<br>✓ screenshot<br>v${m.result.version}</span>${m.warnings.length?`<br><small>${m.warnings.length} warnings</small>`:''}`}if(m.type==='error'){busy(false);$('result').innerHTML=`<span class="error">${m.message}</span>`}};endpoint.onchange=ping;setInterval(ping,5000);$('selectionButton').onclick=()=>{busy(true);send({type:'export',scope:'SELECTION',includeHidden:$('hidden').checked,scale:Number($('scale').value)})};$('pageButton').onclick=()=>{busy(true);send({type:'export',scope:'PAGE',includeHidden:$('hidden').checked,scale:Number($('scale').value)})};send({type:'ready'});ping();</script></body></html>
